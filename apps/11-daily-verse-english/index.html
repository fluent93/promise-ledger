<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4d03f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Seinfeld English" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Seinfeld English — Authentic Sitcom Mastery</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=0.31" />
  </head>
  <body>
    <main class="container">
      <!-- Expressive Sitcom Card Header -->
      <section class="card header-card">
        <header class="top-bar">
          <span class="date" id="currentDate"></span>
          <span class="tag">Original Sitcom Audio</span>
        </header>
        <p class="subtitle">TODAY'S EXPRESSION</p>
        <h1 class="expression-title" id="expressionPhrase">Loading...</h1>
        <p class="meaning" id="expressionMeaning"></p>
        <p class="episode-info" id="expressionSource"></p>
      </section>

      <!-- Full Sitcom Scene Dialogue Section -->
      <section class="card dialogue-card">
        <header class="section-header">
          <h2 id="conversationTitle">Scene Dialogue</h2>
          <button type="button" class="play-button" id="playButton">▶ 원본 클립 듣기</button>
        </header>
        <div class="dialogue" id="expressionExample"></div>
      </section>

      <!-- Intermediate Nuance & Context Section -->
      <section class="card nuance-card">
        <h3>💡 뉘앙스 & 문화적 맥락 (Nuance & Context)</h3>
        <div id="expressionNuance" class="card-content"></div>
      </section>

      <!-- Real-World Application Section -->
      <section class="card modern-card">
        <h3>💼 2026 실전 응용 (Real-World Application)</h3>
        <p class="card-subtitle">미국인 친구/직장에서 지금 바로 쓰는 현대적 대화</p>
        <div id="expressionModern" class="dialogue modern-dialogue"></div>
      </section>

      <p class="status" id="statusMessage" role="status"></p>
    </main>

    <script src="./src/app.js?v=0.35" type="module"></script>
  </body>
</html>
