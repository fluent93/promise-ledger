<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4d03f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Seinfeld English" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Seinfeld English</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=0.28" />
  </head>
  <body>
    <header class="app-header">
      <a class="wordmark" href="./" aria-label="Seinfeld English 홈">
        <span>SE</span>
        <strong>Seinfeld English</strong>
      </a>
      <button type="button" class="quiet-button" id="notificationButton" aria-pressed="false">09:30 알림</button>
    </header>

    <main class="lesson">
      <p class="date" id="dateLabel"></p>
      <p class="eyebrow">Today's expression</p>
      <h1 id="expressionPhrase"></h1>
      <p class="meaning" id="expressionMeaning"></p>
      <p class="episode-source" id="expressionSource"></p>

      <section class="conversation" aria-labelledby="conversationTitle">
        <header>
          <h2 id="conversationTitle">Conversation</h2>
          <button type="button" class="play-button" id="playButton">▶ 듣기</button>
        </header>
        <div class="dialogue" id="expressionExample"></div>
      </section>

      <p class="status" id="statusMessage" role="status"></p>
    </main>

    <script src="./src/app.js?v=0.28" type="module"></script>
  </body>
</html>
